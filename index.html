<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM - Corporate Medical Emergency Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .font-corporate {
            font-family: 'Montserrat', sans-serif;
        }

        .bg-medical-blue {
            background-color: #0f172a;
        }

        .text-medical-blue {
            color: #0f172a;
        }

        /* Custom Leaflet Marker Styling */
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .marker-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }

            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        /* Animação de Sucesso no Despacho */
        @keyframes dispatch-success {
            0% {
                transform: scale(1);
                border-color: #e2e8f0;
            }

            50% {
                transform: scale(1.01);
                border-color: #10b981;
                box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
            }

            100% {
                transform: scale(1);
                border-color: #10b981;
            }
        }

        .animate-dispatch-success {
            animation: dispatch-success 0.8s ease-out forwards;
        }
    </style>
    <!-- PeerJS for WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        window.onerror = function (msg, url, line, col, error) {
            const root = document.getElementById('root');
            if (root) {
                root.innerHTML = '<div style="padding: 20px; background: #fee2e2; border: 2px solid #ef4444; color: #b91c1c;">' +
                    '<h1>ERRO CRÍTICO (HTML)</h1>' +
                    '<p>' + msg + '</p>' +
                    '<p>Arquivo: ' + url + ':' + line + ':' + col + '</p>' +
                    '</div>';
            }
            return false;
        };
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
